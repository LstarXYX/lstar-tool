[package]
name = "lstar-tools"
version = "0.1.0"
description = "Lstar Tools desktop application"
authors = ["Lstar Tools"]
edition = "2021"

[lib]
name = "lstar_tools_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
