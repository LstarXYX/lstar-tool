name: Build frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Check code style
        run: npm run lint

      - name: Build production files
        run: npm run build

      - name: Retain dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: lstar-tool-dist
          path: dist
          if-no-files-found: error
          retention-days: 90
